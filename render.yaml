services:
  - type: web
    name: projecthub-api
    runtime: node
    region: singapore # closest to your Neon ap-southeast-1 database
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @projecthub/api prisma:generate && pnpm --filter @projecthub/api build
    startCommand: node apps/api/dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # set manually in Render dashboard — never commit secrets
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false # set to your Vercel web URL after deploying
